{% extends "base.html" %}
{% block title %}Member Login · High Desert Soaring Club{% endblock %}
{% block body %}
<div class="container">
<section class="section-padded" style="max-width: 480px; margin-inline: auto;">
  <div class="card-soft">
    <h1 class="h4 mb-3">Member login</h1>
    <p class="text-muted mb-4">
      Log in with your email to reach the scheduling board, club documents, and member tools.
    </p>
    <form method="post" autocomplete="off">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" type="email" class="form-control" autofocus required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" name="password" type="password" class="form-control" required>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="stay" id="stay" checked>
        <label class="form-check-label" for="stay">Stay logged in on this device</label>
      </div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
  </div>
</section>
</div>
{% endblock %}
