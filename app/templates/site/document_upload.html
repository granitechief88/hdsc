{% extends "base.html" %}
{% block body %}
<div class="container">
<section class="section-padded" style="max-width:560px;">
  <div class="card-soft">
    <h1 class="h4 mb-3">Upload a document</h1>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <input type="file" name="file" class="form-control" required>
        <div class="form-text">Allowed: PDF, Word, text, spreadsheets, slides, and images.</div>
      </div>
      <button class="btn btn-primary" type="submit">Upload</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('site.documents') }}">Cancel</a>
    </form>
  </div>
</section>
</div>
{% endblock %}
